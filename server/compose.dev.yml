# Vaksin App backend for local development: database, database API, gateway.
# Start with `npm run api:up` (it creates server/.env.dev with random secrets first).
# Everything is bound to 127.0.0.1 only. Production gets its own compose file in Phase D.
name: vaksin-dev

services:
  db:
    build: ./db
    image: vaksin-db:17.11
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?run npm run api:up}
      POSTGRES_DB: vaksin
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ../supabase/tests:/tests:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vaksin"]
      interval: 2s
      timeout: 3s
      retries: 30

  rest:
    image: postgrest/postgrest:v16.5
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD}@db:5432/vaksin
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_JWT_AUD: authenticated
      PGRST_DB_MAX_ROWS: "1000"
      PGRST_OPENAPI_MODE: disabled

  auth:
    build: ./auth
    image: vaksin-auth:dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://vaksin_auth:${AUTH_DB_PASSWORD}@db:5432/vaksin
      JWT_SECRET: ${JWT_SECRET}
      OTP_PEPPER: ${OTP_PEPPER}
      # Local test inbox: every email lands in Mailpit (http://127.0.0.1:8025), none go out.
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_REQUIRE_TLS: "0"
      MAIL_FROM: Vaksin App <no-reply@imotion.my>
      SITE_URL: http://localhost:5173/vaksin-app/

  mailpit:
    image: axllent/mailpit:v1.31.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

  gateway:
    image: nginx:1.29.3-alpine
    restart: unless-stopped
    depends_on: [rest, auth]
    environment:
      CORS_ORIGIN: http://localhost:5173
      # Locally the caller's address is the client; behind Cloudflare it is CF-Connecting-IP.
      CLIENT_IP: $$remote_addr
    ports:
      - "127.0.0.1:4011:8080"
    volumes:
      - ./gateway/default.conf.template:/etc/nginx/templates/default.conf.template:ro

volumes:
  db-data:
